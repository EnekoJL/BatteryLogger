[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batterylogger"
version = "2.0.0"
description = "Real-time logger and offline analyzer for CEGASA BCS battery systems"
requires-python = ">=3.10"
dependencies = [
    "aiohttp==3.13.5",
    "dash==4.1.0",
    "dash-bootstrap-components==2.0.4",
    "pandas==3.0.3",
    "plotly==6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "aioresponses>=0.7",
    "freezegun>=1.5",
]

[project.scripts]
battery-logger = "batterylogger.entrypoints.logger_main:main"
battery-analyzer = "batterylogger.entrypoints.analyzer_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
