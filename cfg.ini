[Battery_API]
; IP address of the Battery Management System
IP=192.168.55.193
; How often to poll the live data endpoint (seconds)
PollInterval=10

[Logging]
; How often to write a row to the CSV file (seconds)
LogFrequency=10
; Create a new CSV file each day at midnight
RotateDaily=false

[Battery_Config]
; Number of cells in series per module (used for IR and corrected VCell calc)
NumCells=15
; Number of modules per string
NumModules=1

[Alerts]
; Log a WARNING when SOC drops below this percentage
SocLowThreshold=20
; Log a WARNING when maximum cell temperature exceeds this value (°C)
TempHighThreshold=45
